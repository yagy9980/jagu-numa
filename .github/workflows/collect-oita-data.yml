name: Collect Oita public hall data

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/collect-oita-data.yml"
      - "scripts/collect_oita_slodata.py"
      - "scripts/requirements.txt"
  schedule:
    # 23:10 JST every day
    - cron: "10 14 * * *"

permissions:
  contents: read

jobs:
  collect-slodata-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Collect and store Oita machine data
        env:
          SUPABASE_URL: https://orxhhddrjbxjkyxjdegf.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MAX_AGE_DAYS: "60"
          MAX_REPORTS: "200"
        run: python scripts/collect_oita_slodata.py
